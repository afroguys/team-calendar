<!DOCTYPE html>
<html lang="ms" data-theme="cyber">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Family Calendar</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
  <style>
    :root{
      --cyber-bg:#0b0f19;--cyber-surface:rgba(255,255,255,.03);--cyber-surface2:rgba(255,255,255,.06);--cyber-text:#e0f7fa;--cyber-text2:#80deea;--cyber-text3:#4dd0e1;
      --cyber-neon:#00f3ff;--cyber-pink:#ff0080;--cyber-purple:#7928ca;--cyber-gold:#ffb300;--cyber-green:#00e676;--cyber-red:#ff1744;
      --cyber-border:rgba(0,243,255,.15);--cyber-border2:rgba(0,243,255,.25);--cyber-glass:rgba(255,255,255,.03);--cyber-glass-hover:rgba(0,243,255,.08);
      --cyber-glow:0 0 15px rgba(0,243,255,.15);--cyber-glow2:0 0 25px rgba(255,0,128,.2);--cyber-glow3:0 0 10px rgba(0,243,255,.3);
      --cyber-radius:12px;--cyber-blur:12px;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Inter',sans-serif;background:var(--cyber-bg);color:var(--cyber-text);min-height:100vh}
    h1,h2,h3{font-family:'Orbitron',sans-serif;letter-spacing:.5px}
    .noise-overlay{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.02;
      background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      background-size:256px 256px}
    .app-layout{display:grid;grid-template-columns:1fr 320px;grid-template-rows:auto 1fr;height:100vh;gap:0;position:relative;z-index:1}
    /* Glass topbar */
    .topbar{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;padding:10px 16px;
      background:var(--cyber-glass);backdrop-filter:blur(var(--cyber-blur));-webkit-backdrop-filter:blur(var(--cyber-blur));
      border-bottom:1px solid var(--cyber-border);flex-wrap:wrap;gap:6px}
    .brand{font-family:'Orbitron',sans-serif;font-size:.95rem;font-weight:700;color:var(--cyber-neon);display:flex;align-items:center;gap:8px;text-transform:uppercase;letter-spacing:2px}
    .top-actions{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
    .user-pill{display:flex;align-items:center;gap:5px;font-size:.78rem;font-weight:600;padding:5px 12px;border-radius:20px;background:var(--cyber-surface2);border:1px solid var(--cyber-border);color:var(--cyber-text2)}
    .user-dot{width:10px;height:10px;border-radius:50%;box-shadow:0 0 6px currentColor}
    .btn{display:inline-flex;align-items:center;gap:4px;padding:6px 12px;border-radius:8px;font-weight:600;font-size:.76rem;cursor:pointer;border:1px solid transparent;font-family:'Inter',sans-serif;text-decoration:none;transition:all .15s;text-transform:uppercase;letter-spacing:.5px}
    .btn-sm{padding:4px 8px;font-size:.68rem}
    .btn-pri{background:rgba(0,243,255,.1);color:var(--cyber-neon);border-color:var(--cyber-border);box-shadow:var(--cyber-glow3)}
    .btn-pri:hover{background:rgba(0,243,255,.2);box-shadow:0 0 20px rgba(0,243,255,.4)}
    .btn-out{background:transparent;color:var(--cyber-text2);border-color:var(--cyber-border)}
    .btn-out:hover{background:var(--cyber-glass-hover);border-color:var(--cyber-neon)}
    .btn-red{background:rgba(255,23,68,.15);color:var(--cyber-red);border-color:rgba(255,23,68,.25)}.btn-red:hover{background:rgba(255,23,68,.25)}

    .main-content{padding:6px;overflow-y:auto}
    .side-panel{background:transparent;border-left:1px solid var(--cyber-border);overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px}

    /* Glass side sections */
    .side-section{background:var(--cyber-glass);backdrop-filter:blur(var(--cyber-blur));-webkit-backdrop-filter:blur(var(--cyber-blur));
      border-radius:var(--cyber-radius);padding:14px;border:1px solid var(--cyber-border);box-shadow:var(--cyber-glow);transition:all .2s}
    .side-section:hover{border-color:var(--cyber-border2);box-shadow:0 0 25px rgba(0,243,255,.2)}
    .side-section h3{font-size:.8rem;font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:5px;color:var(--cyber-neon);text-transform:uppercase;letter-spacing:1px}

    /* FullCalendar — Cyberpunk override */
    .fc{font-family:'Inter',sans-serif!important;font-size:.78rem!important;background:transparent!important}
    .fc .fc-toolbar-title{font-family:'Orbitron',sans-serif!important;font-size:.9rem!important;font-weight:700!important;color:var(--cyber-neon)!important;text-transform:uppercase;letter-spacing:2px}
    .fc .fc-button{font-family:'Inter',sans-serif!important;padding:5px 10px!important;font-size:.7rem!important;font-weight:600!important;border-radius:8px!important;text-transform:uppercase!important;letter-spacing:.5px!important;
      background:var(--cyber-glass)!important;border:1px solid var(--cyber-border)!important;color:var(--cyber-text2)!important}
    .fc .fc-button:hover{background:var(--cyber-glass-hover)!important;border-color:var(--cyber-neon)!important;color:var(--cyber-neon)!important}
    .fc .fc-button-primary{background:rgba(0,243,255,.1)!important;border-color:var(--cyber-border2)!important;color:var(--cyber-neon)!important;box-shadow:var(--cyber-glow3)!important}
    .fc .fc-button-primary:hover{box-shadow:0 0 20px rgba(0,243,255,.4)!important}
    .fc .fc-today-button{background:rgba(255,0,128,.1)!important;border-color:rgba(255,0,128,.3)!important;color:var(--cyber-pink)!important}
    .fc .fc-day-today{background:rgba(0,243,255,.03)!important}
    .fc .fc-col-header-cell{background:rgba(0,0,0,.3)!important;font-weight:600!important;font-size:.7rem!important;padding:6px!important;text-transform:uppercase;color:var(--cyber-neon)!important;border-color:var(--cyber-border)!important;font-family:'Orbitron',sans-serif!important;letter-spacing:1px}
    .fc .fc-scrollgrid,.fc .fc-scrollgrid td,.fc .fc-scrollgrid th{border-color:var(--cyber-border)!important}
    .fc .fc-view-harness{background:var(--cyber-glass)!important;backdrop-filter:blur(10px)!important;-webkit-backdrop-filter:blur(10px)!important;border:1px solid var(--cyber-border2)!important;border-radius:16px!important;box-shadow:0 0 20px rgba(0,243,255,.15)!important}
    .fc .fc-daygrid-day,.fc .fc-timegrid-slot{background:transparent!important}
    .fc .fc-daygrid-day-number,.fc .fc-timegrid-slot-label{color:var(--cyber-text)!important}
    .fc .fc-timegrid-slot{height:30px!important;border-color:var(--cyber-border)!important}
    /* Neon events */
    .fc .fc-event{background:linear-gradient(135deg,var(--cyber-purple),var(--cyber-pink))!important;border:none!important;box-shadow:0 0 10px var(--cyber-pink)!important;border-radius:6px!important;padding:2px 6px!important;font-size:.68rem!important;font-weight:500!important;cursor:pointer!important;color:#fff!important}
    .fc .fc-event:hover{filter:brightness(1.2)!important;box-shadow:0 0 20px var(--cyber-pink)!important}
    .holiday-event{background:rgba(255,255,255,.04)!important;box-shadow:none!important;border-left:2px solid var(--cyber-border2)!important;border-radius:2px!important;font-size:.6rem!important;opacity:.7;color:var(--cyber-text3)!important}
    .holiday-event:hover{opacity:1!important;filter:none!important;box-shadow:0 0 8px rgba(0,243,255,.1)!important}
    .fc .fc-popover{background:var(--cyber-bg)!important;border:1px solid var(--cyber-border2)!important;box-shadow:0 0 30px rgba(0,243,255,.2)!important}
    .fc .fc-popover-header{background:var(--cyber-surface2)!important}

    /* Birthday + Chore */
    .bday-item,.chore-item{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--cyber-border);font-size:.76rem}
    .bday-item:last-child,.chore-item:last-child{border-bottom:none}
    .bday-avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.68rem;color:#fff;flex-shrink:0}
    .bday-info{flex:1}.bday-info strong{display:block;font-size:.78rem;color:var(--cyber-text)}.bday-info span{font-size:.66rem;color:var(--cyber-text3)}
    .bday-countdown{background:rgba(255,179,0,.15);color:var(--cyber-gold);padding:2px 8px;border-radius:20px;font-size:.63rem;font-weight:700;white-space:nowrap;border:1px solid rgba(255,179,0,.3)}
    .bday-today{background:rgba(255,23,68,.2)!important;color:var(--cyber-red)!important;border-color:rgba(255,23,68,.4)!important;animation:pulse 1.5s infinite}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
    .chore-check{width:20px;height:20px;border-radius:6px;border:2px solid var(--cyber-border);cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:.6rem;color:transparent;transition:all .12s}
    .chore-check.done{background:var(--cyber-green);border-color:var(--cyber-green);color:#000;box-shadow:0 0 8px var(--cyber-green)}
    .chore-name{flex:1}.chore-name.done{text-decoration:line-through;color:var(--cyber-text3)}
    .chore-assigned{font-size:.63rem;color:var(--cyber-text3)}
    .bday-item:hover .chore-del,.bday-item:hover .chore-edit-btn{opacity:1!important}
    .chore-del{color:var(--cyber-text3);cursor:pointer;font-size:.7rem;background:none;border:none;padding:2px;opacity:0;transition:opacity .12s}.chore-item:hover .chore-del,.chore-item:hover .chore-edit-btn{opacity:1}
    .chore-edit-btn{color:var(--cyber-text3);cursor:pointer;font-size:.65rem;background:none;border:none;padding:2px;opacity:0;transition:opacity .12s;margin-left:2px}
    .chore-edit-btn:hover{color:var(--cyber-neon)}
    .legend{display:flex;flex-wrap:wrap;gap:5px}
    .legend-tag{display:flex;align-items:center;gap:4px;padding:3px 8px;border-radius:20px;background:var(--cyber-surface2);font-size:.64rem;font-weight:600;border:1px solid var(--cyber-border);color:var(--cyber-text2)}

    /* Theme toggle */
    .theme-btns{display:none}

    /* Modal */
    .modal-overlay{display:none;position:fixed;inset:0;z-index:2000;background:rgba(0,0,0,.7);align-items:center;justify-content:center;padding:16px}
    .modal-overlay.show{display:flex}
    .modal{background:var(--cyber-bg);border-radius:14px;padding:20px;max-width:440px;width:100%;box-shadow:0 0 40px rgba(0,243,255,.2);max-height:90vh;overflow-y:auto;border:1px solid var(--cyber-border2)}
    .modal h3{font-family:'Orbitron',sans-serif;font-size:.9rem;margin-bottom:12px;color:var(--cyber-neon)}
    .fg{margin-bottom:10px}.fg label{display:block;font-size:.7rem;font-weight:600;margin-bottom:3px;color:var(--cyber-text2);text-transform:uppercase;letter-spacing:.5px}
    .fg input,.fg textarea,.fg select{width:100%;padding:8px 12px;border:1px solid var(--cyber-border);border-radius:8px;font-size:.8rem;font-family:inherit;background:var(--cyber-surface2);color:var(--cyber-text)}
    .fg input:focus,.fg textarea:focus,.fg select:focus{outline:none;border-color:var(--cyber-neon);box-shadow:0 0 10px rgba(0,243,255,.2)}
    .fg textarea{resize:vertical;min-height:50px}
    .category-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-bottom:10px}
    .cat-chip{text-align:center;padding:7px 3px;border-radius:8px;border:1px solid var(--cyber-border);cursor:pointer;font-size:.66rem;font-weight:600;transition:all .12s;background:transparent;color:var(--cyber-text2)}
    .cat-chip:hover{border-color:var(--cyber-neon)}.cat-chip.selected{opacity:1;transform:scale(1.03);border-color:var(--cyber-neon);box-shadow:var(--cyber-glow3)}
    .cat-chip .cat-ico{display:block;font-size:1rem;margin-bottom:1px}
    .btn-row{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
    .toast{position:fixed;bottom:20px;right:20px;z-index:3000;padding:12px 18px;border-radius:10px;color:#000;font-weight:600;font-size:.78rem;transform:translateY(100px);opacity:0;transition:all .3s}
    .toast.show{transform:translateY(0);opacity:1}.toast-success{background:var(--cyber-neon)}.toast-error{background:var(--cyber-pink)}

    @media(max-width:900px){
      .app-layout{grid-template-columns:1fr;grid-template-rows:auto 1fr auto;padding-bottom:58px}
      .side-panel{flex-direction:column;gap:8px;padding:8px;max-height:none;overflow-y:visible;border-left:none;border-top:1px solid var(--cyber-border)}
      .side-section{flex:1;min-width:100%}.category-grid{grid-template-columns:repeat(3,1fr)}
      /* Collapsible sections */
      .side-section h3{cursor:pointer;user-select:none;display:flex;justify-content:space-between;align-items:center}
      .sec-arrow{transition:transform .2s}
      .side-section.collapsed .sec-arrow{transform:rotate(-90deg)}
      .side-section.collapsed .sec-body{display:none}
      .side-section.collapsed .btn{display:none}
      /* Mobile action bar */
      .mobile-actions{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:1000;background:var(--cyber-bg);border-top:1px solid var(--cyber-border2);padding:6px 8px calc(6px + env(safe-area-inset-bottom));gap:6px;justify-content:center}
      .mob-btn{flex:1;padding:10px 4px;border-radius:10px;border:1px solid var(--cyber-border2);background:var(--cyber-surface2);color:var(--cyber-neon);font-size:.68rem;font-weight:700;font-family:'Inter',sans-serif;cursor:pointer;min-height:44px}
      .mob-btn:active{background:var(--cyber-glass-hover)}
      /* Topbar compact */
      .topbar{flex-wrap:wrap;padding:6px 10px}
      .brand{font-size:.8rem}
      .top-actions .btn{padding:6px 10px;min-height:40px}
      .legend{order:3;width:100%;justify-content:center}
      /* Calendar mobile */
      .fc{font-size:.72rem!important}
      .fc .fc-toolbar-title{font-size:.8rem!important}
      .fc .fc-button{padding:5px 8px!important;font-size:.66rem!important;min-height:36px!important}
      .fc .fc-daygrid-day-number{font-size:.68rem}
      .fc .fc-event{font-size:.6rem!important;padding:1px 3px!important}
      .fc .fc-view-harness{border-radius:10px!important}
      /* Modals full width on mobile */
      .modal{max-width:100%;border-radius:16px 16px 0 0;max-height:85vh;padding:18px}
      .modal-overlay{align-items:flex-end;padding:0}
      .btn-row .btn,.btn-row .btn-sm{padding:10px 14px;min-height:44px;font-size:.78rem}
      .fg input,.fg select,.fg textarea{min-height:44px;font-size:.9rem}
      .cat-chip{min-height:48px;display:flex;flex-direction:column;justify-content:center}
      /* Toast above action bar */
      .toast{bottom:70px;right:12px;left:12px;text-align:center}
    }
    @media(min-width:901px){.mobile-actions{display:none}}
    /* ===== VIOLET PULSE THEME ===== */
    [data-theme="violet"]{
      --cyber-bg:#F9FBFF;--cyber-surface:rgba(255,255,255,.72);--cyber-surface2:rgba(255,255,255,.85);--cyber-text:#1E293B;--cyber-text2:#475569;--cyber-text3:#64748B;
      --cyber-neon:#432DD7;--cyber-pink:#0092B8;--cyber-purple:#7C3AED;--cyber-gold:#F59E0B;--cyber-green:#16A34A;--cyber-red:#DC2626;
      --cyber-border:rgba(67,45,215,.1);--cyber-border2:rgba(67,45,215,.2);--cyber-glass:rgba(255,255,255,.7);--cyber-glass-hover:rgba(67,45,215,.06);
      --cyber-glow:0 2px 12px rgba(67,45,215,.06);--cyber-glow2:0 4px 16px rgba(0,146,184,.08);--cyber-glow3:0 2px 8px rgba(67,45,215,.15);
    }
    [data-theme="violet"] body{background:#F1F5F9}
    [data-theme="violet"] h1,[data-theme="violet"] h2,[data-theme="violet"] h3{font-family:'Inter',sans-serif!important;letter-spacing:0;text-transform:none}
    [data-theme="violet"] .brand{font-family:'Inter',sans-serif;text-transform:none;letter-spacing:0;color:var(--cyber-neon)}
    [data-theme="violet"] .btn{text-transform:none;letter-spacing:0;border-radius:10px}
    [data-theme="violet"] .fc .fc-toolbar-title{font-family:'Inter',sans-serif!important;text-transform:none;letter-spacing:0}
    [data-theme="violet"] .fc .fc-col-header-cell{font-family:'Inter',sans-serif!important;letter-spacing:0;text-transform:none}
    [data-theme="violet"] .fc .fc-button{text-transform:none!important;letter-spacing:0!important;border-radius:10px!important}
    [data-theme="violet"] .side-section h3{text-transform:none;letter-spacing:0}
    [data-theme="violet"] .noise-overlay{opacity:0}
  </style>
</head>
<body>
<div class="noise-overlay"></div>
<div class="app-layout">
  <div class="topbar">
    <div class="brand">◆ <span id="familyName">FAMILY CALENDAR</span></div>
    <div class="legend" id="legend"></div>
    <div class="top-actions">
      <span class="user-pill"><span class="user-dot" id="myDot"></span><span id="myName">...</span></span>
      <a href="/admin" id="adminLink" class="btn btn-out btn-sm" style="display:none">⚙️ ADMIN</a>
      <button id="settingsBtn" class="btn btn-out btn-sm" style="display:none" onclick="openSettingsPanel()">🔧</button>
      <button class="btn btn-out btn-sm" onclick="logout()">✕</button>
    </div>
  </div>
  <div class="main-content" id="calendar"></div>
  <div class="side-panel">
    <div class="side-section" id="bdaySection"><h3 onclick="toggleSection('bdaySection')">◈ COUNTDOWN <span class="sec-arrow">▾</span></h3><div class="sec-body" id="bdayList"><span style="font-size:.7rem;color:var(--cyber-text3)">Loading...</span></div>
      <button class="btn btn-pri btn-sm" onclick="openBdayAdd()" style="margin-top:6px;width:100%;justify-content:center">+ TAMBAH</button></div>
    <div class="side-section" id="choreSection"><h3 onclick="toggleSection('choreSection')">◈ TUGASAN <span class="sec-arrow">▾</span></h3><div class="sec-body" id="choreList"><span style="font-size:.7rem;color:var(--cyber-text3)">Loading...</span></div>
      <form onsubmit="addChore(event)" style="display:flex;gap:5px;margin-top:6px">
        <input type="text" id="choreNew" placeholder="Tugasan baru..." style="flex:1;padding:6px 8px;border:1px solid var(--cyber-border);border-radius:6px;font-size:.74rem;font-family:inherit;background:var(--cyber-surface2);color:var(--cyber-text)">
        <button class="btn btn-pri btn-sm">+</button></form></div>
  </div>
</div>

<!-- Mobile quick action bar -->
<div class="mobile-actions" id="mobileActions">
  <button class="mob-btn" onclick="openEventModal(null)">📅 Acara</button>
  <button class="mob-btn" onclick="openBdayAdd()">🎂 Hari Lahir</button>
  <button class="mob-btn" onclick="document.getElementById('choreSection').scrollIntoView({behavior:'smooth'});document.getElementById('choreNew').focus()">📋 Tugasan</button>
  <button class="mob-btn" id="mobSettingsBtn" style="display:none" onclick="openSettingsPanel()">🔧</button>
</div>


<div class="modal-overlay" id="eventModal"><div class="modal"><h3 id="modalTitle">◈ ACARA BARU</h3>
  <form onsubmit="saveEvent(event)"><input type="hidden" id="eventId">
    <div class="fg"><label>Tajuk</label><input type="text" id="evTitle" required></div>
    <div class="fg"><label>Deskripsi</label><textarea id="evDesc"></textarea></div>
    <div class="fg"><label>Mula</label><input type="datetime-local" id="evStart" required></div>
    <div class="fg"><label>Tamat</label><input type="datetime-local" id="evEnd"></div>
    <div class="category-grid" id="catGrid"></div>
    <div class="btn-row"><button type="button" class="btn btn-red btn-sm" id="btnDelete" style="display:none;margin-right:auto" onclick="deleteEvent()">PADAM</button>
      <button type="button" class="btn btn-out btn-sm" onclick="closeModal()">BATAL</button>
      <button type="submit" class="btn btn-pri btn-sm">SIMPAN</button></div>
  </form></div></div>

<div class="modal-overlay" id="bdayModal"><div class="modal"><h3>◈ BIRTHDAY</h3>
  <form onsubmit="addBirthday(event)"><div class="fg"><label>Nama</label><input type="text" id="bdName" required></div>
    <div class="fg"><label>Tarikh</label><input type="date" id="bdDate" required></div>
    <div class="fg"><label>Nota</label><input type="text" id="bdNote"></div>
    <div class="btn-row"><button type="button" class="btn btn-out btn-sm" onclick="document.getElementById('bdayModal').classList.remove('show')">BATAL</button>
      <button type="submit" class="btn btn-pri btn-sm">SIMPAN</button></div>
  </form></div></div>

<div class="toast" id="toast"></div>

<!-- SETTINGS MODAL -->
<div class="modal-overlay" id="settingsModal"><div class="modal" style="max-width:500px">
  <h3>🔧 TETAPAN</h3>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
    <div class="fg"><label>Nama Keluarga</label><input type="text" id="sFamilyName"></div>
    <div class="fg"><label>Subtitle Login</label><input type="text" id="sTagline"></div>
    <div class="fg"><label>Footer</label><input type="text" id="sFooter"></div>
    <div class="fg"><label>Tema</label><select id="sTheme"><option value="cyber">💻 Cyber</option><option value="violet">💜 Violet Pulse</option></select></div>
    <div class="fg"><label>Zon</label><select id="sZone"><option value="B">Zon B (Isnin)</option><option value="A">Zon A (Ahad)</option></select></div>
  </div>
  <div class="btn-row"><button type="button" class="btn btn-out btn-sm" onclick="document.getElementById('settingsModal').classList.remove('show')">BATAL</button><button class="btn btn-pri btn-sm" onclick="saveSettingsPanel()">💾 SIMPAN</button></div>
</div></div>

<script>
var CATS={merah:{id:'merah',label:'Kecemasan',color:'#ff1744',icon:'🚨'},hijau:{id:'hijau',label:'Cuti',color:'#00e676',icon:'✈️'},kuning:{id:'kuning',label:'Birthday',color:'#ffb300',icon:'🎂'},biru:{id:'biru',label:'Tugasan',color:'#00f3ff',icon:'📋'},ungu:{id:'ungu',label:'Sekolah',color:'#7928ca',icon:'📚'},oren:{id:'oren',label:'Sukan',color:'#ff0080',icon:'⚽'},cuti:{id:'cuti',label:'Cuti Umum',color:'#4dd0e1',icon:'🇲🇾'}};
var selectedCat='biru';
function renderCatGrid(a){var h='';Object.values(CATS).forEach(function(c){h+='<div class="cat-chip'+(a===c.id?' selected':'')+'" style="border-color:'+(a===c.id?'var(--cyber-neon)':'var(--cyber-border)')+';color:'+(a===c.id?'var(--cyber-neon)':'var(--cyber-text2)')+'" onclick="selectCat(\''+c.id+'\')"><span class="cat-ico">'+c.icon+'</span>'+c.label+'</div>'});document.getElementById('catGrid').innerHTML=h}
function selectCat(id){selectedCat=id;renderCatGrid(id)}

var token=localStorage.getItem('token'),user=JSON.parse(localStorage.getItem('user')||'{}');
if(!token||!user.id)window.location.href='/login';
document.getElementById('myName').textContent=user.full_name||user.username;
document.getElementById('myDot').style.background=user.color;document.getElementById('myDot').style.color=user.color;
if(user.is_admin){document.getElementById('adminLink').style.display='inline-flex';document.getElementById('settingsBtn').style.display='inline-flex';document.getElementById('mobSettingsBtn').style.display='inline-flex'}
function logout(){localStorage.clear();window.location.href='/login'}

// Collapsible side sections (mobile friendly)
function toggleSection(id){
  var sec=document.getElementById(id);
  if(sec)sec.classList.toggle('collapsed');
}
// Auto-collapse side sections on small screens
if(window.innerWidth<=900){
  setTimeout(function(){
    ['bdaySection','choreSection'].forEach(function(id){
      var s=document.getElementById(id);if(s)s.classList.add('collapsed');
    });
  },500);
}

async function api(url,opts){if(!opts)opts={};if(!opts.headers)opts.headers={};opts.headers['Authorization']='Bearer '+token;if(opts.body&&typeof opts.body==='object'){opts.headers['Content-Type']='application/json';opts.body=JSON.stringify(opts.body)}return fetch(url,opts).then(function(r){return r.json().then(function(d){return{ok:r.ok,status:r.status,data:d}})})}

var calendar;
document.addEventListener('DOMContentLoaded',function(){
  loadSettings();loadAll();
  var isMobile=window.innerWidth<=900;
  var toolbarRight=isMobile?'listMonth,dayGridMonth':'dayGridMonth,timeGridWeek';
  calendar=new FullCalendar.Calendar(document.getElementById('calendar'),{
    initialView:isMobile?'listMonth':'dayGridMonth',
    headerToolbar:{left:'prev,next today',center:'title',right:toolbarRight},
    height:isMobile?'auto':'100%',locale:'ms',firstDay:1,selectable:true,editable:true,
    eventDurationEditable:false,events:fetchEvents,
    select:function(info){openEventModal(null,info.startStr,info.endStr||info.startStr)},
    eventClick:function(info){if(info.event.extendedProps.category==='cuti'){toast(info.event.title,'success');return}openEventModal(info.event)},
    eventDrop:function(info){updateFromDrop(info.event)},
    eventResize:function(info){updateFromDrop(info.event)},
    eventClassNames:function(arg){return arg.event.extendedProps.category==='cuti'?['holiday-event']:[]}
  });
  calendar.render();renderCatGrid('biru');
});

async function loadSettings(){try{var r=await fetch('/api/settings').then(function(r){return r.json()});document.getElementById('familyName').textContent=r.family_name||'FAMILY CALENDAR';document.title=r.family_name||'Family Calendar';var theme=r.theme||'cyber';document.documentElement.setAttribute('data-theme',theme);var zone=r.zone||'B';if(calendar)calendar.setOption('firstDay',zone==='A'?0:1)}catch(e){}}
function fetchEvents(info,success,fail){api('/api/events?start='+info.startStr+'&end='+info.endStr).then(function(r){if(r.ok)success(r.data);else fail()}).catch(fail)}
function updateFromDrop(event){api('/api/events/'+event.id,{method:'PUT',body:{start:event.start.toISOString(),end:event.end?event.end.toISOString():event.start.toISOString()}}).then(function(r){if(!r.ok){calendar.refetchEvents();toast('GAGAL','error')}})}

function openEventModal(event,startStr,endStr){document.getElementById('eventId').value=event?event.id:'';document.getElementById('modalTitle').textContent=event?'◈ EDIT ACARA':'◈ ACARA BARU';document.getElementById('evTitle').value=event?event.title:'';document.getElementById('evDesc').value=event?(event.extendedProps.description||''):'';document.getElementById('evStart').value=event?event.startStr.slice(0,16):(startStr||'').slice(0,16);document.getElementById('evEnd').value=event?(event.endStr?event.endStr.slice(0,16):''):(endStr||'').slice(0,16);document.getElementById('btnDelete').style.display=event?'inline-flex':'none';selectedCat=event?(event.extendedProps.category||'biru'):'biru';renderCatGrid(selectedCat);document.getElementById('eventModal').classList.add('show')}
function closeModal(){document.getElementById('eventModal').classList.remove('show')}
async function saveEvent(e){e.preventDefault();var id=document.getElementById('eventId').value;var data={title:document.getElementById('evTitle').value,description:document.getElementById('evDesc').value,start:document.getElementById('evStart').value,end:document.getElementById('evEnd').value||document.getElementById('evStart').value,category:selectedCat,color:CATS[selectedCat].color};var r=id?await api('/api/events/'+id,{method:'PUT',body:data}):await api('/api/events',{method:'POST',body:data});if(r.ok){calendar.refetchEvents();closeModal();loadAll();toast('DISMIPAN')}else toast('GAGAL','error')}
async function deleteEvent(){if(!confirm('Padam?'))return;var r=await api('/api/events/'+document.getElementById('eventId').value,{method:'DELETE'});if(r.ok){calendar.refetchEvents();closeModal();loadAll();toast('DIPADAM')}else toast('GAGAL','error')}

function openBdayAdd(){delete document.getElementById('bdayModal').dataset.editId;document.getElementById('bdName').value='';document.getElementById('bdDate').value='';document.getElementById('bdNote').value='';document.getElementById('bdayModal').querySelector('h3').textContent='◈ BIRTHDAY';document.getElementById('bdayModal').querySelector('button[type=submit]').textContent='SIMPAN';document.getElementById('bdayModal').classList.add('show')}
async function loadBirthdays(){var r=await api('/api/birthdays'),list=document.getElementById('bdayList');if(!r.ok){list.innerHTML='<span style="font-size:.7rem">Ralat</span>';return}var colors=['#ff1744','#ff0080','#ffb300','#00e676','#00f3ff','#7928ca'];list.innerHTML=r.data.slice(0,5).map(function(b,i){return'<div class="bday-item"><div class="bday-avatar" style="background:'+colors[i%6]+'">'+b.name[0]+'</div><div class="bday-info"><strong>'+b.name+'</strong><span>'+b.date+' • '+b.age+' thn</span></div><span class="bday-countdown'+(b.daysLeft===0?' bday-today':'')+'">'+(b.daysLeft===0?'TODAY':b.daysLeft+' Hari')+'</span><button class="chore-del" onclick="delBirthday('+b.id+')" title="Padam" style="opacity:0;font-size:.65rem">✕</button><button class="chore-edit-btn" onclick="editBirthday('+b.id+')" title="Edit" style="opacity:0">✎</button></div>'}).join('')||'<span style="font-size:.7rem;color:var(--cyber-text3)">Tiada</span>'}
async function addBirthday(e){e.preventDefault();var id=document.getElementById('bdayModal').dataset.editId;var data={name:document.getElementById('bdName').value,date:document.getElementById('bdDate').value,note:document.getElementById('bdNote').value};if(id){var r=await api('/api/birthdays/'+id,{method:'PUT',body:data});delete document.getElementById('bdayModal').dataset.editId;document.getElementById('bdayModal').querySelector('h3').textContent='◈ BIRTHDAY';document.getElementById('bdayModal').querySelector('button[type=submit]').textContent='SIMPAN'}else{var r=await api('/api/birthdays',{method:'POST',body:data})}if(r.ok){document.getElementById('bdayModal').classList.remove('show');loadBirthdays();toast('DISMIPAN')}else{toast('GAGAL','error')}}
function editBirthday(id){api('/api/birthdays').then(function(r){if(!r.ok)return;var b=r.data.find(function(x){return x.id===id});if(!b)return;document.getElementById('bdName').value=b.name;document.getElementById('bdDate').value=b.date;document.getElementById('bdNote').value=b.note||'';document.getElementById('bdayModal').dataset.editId=id;document.getElementById('bdayModal').querySelector('h3').textContent='✎ EDIT BIRTHDAY';document.getElementById('bdayModal').querySelector('button[type=submit]').textContent='KEMASKINI';document.getElementById('bdayModal').classList.add('show')})}
async function delBirthday(id){if(!confirm('Padam birthday?'))return;var r=await api('/api/birthdays/'+id,{method:'DELETE'});if(r.ok){loadBirthdays();toast('DIPADAM')}else{toast('GAGAL','error')}}

async function loadChores(){var r=await api('/api/chores'),list=document.getElementById('choreList');if(!r.ok){list.innerHTML='Ralat';return}list.innerHTML=r.data.map(function(c){var actions='';if(c.editable){actions+='<button class="chore-del" onclick="delChore('+c.id+')" title="Padam">✕</button>';actions+='<button class="chore-edit-btn" onclick="editChoreInline('+c.id+')" title="Edit">✎</button>'}return'<div class="chore-item"><div class="chore-check'+(c.done?' done':'')+'" onclick="toggleChore('+c.id+','+c.done+')">✓</div><span class="chore-name'+(c.done?' done':'')+'">'+c.title+'</span><span class="chore-assigned">'+c.assignedName+'</span>'+actions+'</div>'}).join('')||'<span style="font-size:.7rem;color:var(--cyber-text3)">Tiada</span>'}
async function toggleChore(id,done){await api('/api/chores/'+id,{method:'PUT',body:{done:done?0:1}});loadChores()}
async function addChore(e){e.preventDefault();var inp=document.getElementById('choreNew');if(!inp.value.trim())return;var r=await api('/api/chores',{method:'POST',body:{title:inp.value.trim(),assigned_to:user.id}});if(r.ok){inp.value='';loadChores();toast('DITAMBAH')}else toast('GAGAL','error')}
async function delChore(id){await api('/api/chores/'+id,{method:'DELETE'});loadChores()}
function editChoreInline(id){var item=document.querySelector('.chore-item button[onclick="editChoreInline('+id+')"]').parentNode;var nameSpan=item.querySelector('.chore-name');var oldTitle=nameSpan.textContent;var inp=document.createElement('input');inp.type='text';inp.value=oldTitle;inp.className='chore-edit-input';inp.style.cssText='flex:1;padding:2px 6px;border:1px solid var(--cyber-border);border-radius:4px;font-size:.74rem;background:var(--cyber-surface2);color:var(--cyber-text);font-family:inherit';inp.onkeydown=async function(e){if(e.key==='Enter'){var t=inp.value.trim();if(t&&t!==oldTitle){var r=await api('/api/chores/'+id,{method:'PUT',body:{title:t}});if(r.ok){loadChores();toast('DIKEMASKINI')}else{toast('GAGAL','error')}}else{loadChores()}}if(e.key==='Escape'){loadChores()}};inp.onblur=function(){var t=inp.value.trim();if(t&&t!==oldTitle){api('/api/chores/'+id,{method:'PUT',body:{title:t}})};loadChores()};nameSpan.replaceWith(inp);inp.focus();inp.select()}

function loadAll(){api('/api/users').then(function(r){if(r.ok){var h='';r.data.forEach(function(u){h+='<span class="legend-tag"><span class="user-dot" style="background:'+u.color+'"></span>'+u.full_name+'</span>'});h+='<span class="legend-tag">🇲🇾 Cuti</span>';document.getElementById('legend').innerHTML=h}});loadBirthdays();loadChores()}

function toast(msg,type){type=type||'success';var t=document.getElementById('toast');t.textContent=msg;t.className='toast toast-'+type+' show';setTimeout(function(){t.className='toast'},2500)}
function refreshPage(){location.reload()}
// Settings panel (admin only, from calendar page)
function openSettingsPanel(){
  fetch('/api/settings').then(function(r){return r.json()}).then(function(d){
    document.getElementById('sFamilyName').value=d.family_name||'Keluarga Saya';
    document.getElementById('sTagline').value=d.brand_tagline||'';
    document.getElementById('sFooter').value=d.brand_footer||'';
    document.getElementById('sTheme').value=d.theme||'cyber';
    document.getElementById('sZone').value=d.zone||'B';
    document.getElementById('settingsModal').classList.add('show');
  });
}
async function saveSettingsPanel(){
  var data={
    family_name:document.getElementById('sFamilyName').value,
    brand_tagline:document.getElementById('sTagline').value,
    brand_footer:document.getElementById('sFooter').value,
    theme:document.getElementById('sTheme').value,
    zone:document.getElementById('sZone').value
  };
  var r=await api('/api/settings',{method:'PUT',body:data});
  if(r.ok){
    document.getElementById('settingsModal').classList.remove('show');
    document.documentElement.setAttribute('data-theme',data.theme);
    document.getElementById('familyName').textContent=data.family_name;
    document.title=data.family_name||'Family Calendar';
    if(calendar)calendar.setOption('firstDay',data.zone==='A'?0:1);
    toast('✅ TETAPAN DISIMPAN');
  }else{toast('GAGAL','error')}
}
document.addEventListener('keydown',function(e){if(e.key==='Escape'){closeModal();document.getElementById('bdayModal').classList.remove('show');document.getElementById('settingsModal').classList.remove('show')}});
document.getElementById('eventModal').addEventListener('click',function(e){if(e.target===this)closeModal()});
document.getElementById('bdayModal').addEventListener('click',function(e){if(e.target===this)this.classList.remove('show')});
document.getElementById('settingsModal').addEventListener('click',function(e){if(e.target===this)this.classList.remove('show')});
</script>
</body>
</html>
