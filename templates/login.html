<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log Masuk — Family Calendar</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --cyber-bg:#0b0f19;--cyber-neon:#00f3ff;--cyber-pink:#ff0080;--cyber-purple:#7928ca;--cyber-gold:#ffb300;
      --cyber-border:rgba(0,243,255,.2);--cyber-border2:rgba(0,243,255,.3);
      --cyber-glass:rgba(255,255,255,.03);--cyber-glass-hover:rgba(0,243,255,.08);
      --glow:0 0 15px rgba(0,243,255,.15);--glow2:0 0 25px rgba(255,0,128,.2);--glow3:0 0 10px rgba(0,243,255,.3);
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Inter',sans-serif;overflow:hidden;min-height:100vh;display:flex;align-items:center;justify-content:center;position:relative;background:var(--cyber-bg)}

    /* Grid overlay */
    .grid-overlay{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.04;
      background-image:linear-gradient(rgba(0,243,255,.3) 1px,transparent 1px),linear-gradient(90deg,rgba(0,243,255,.3) 1px,transparent 1px);background-size:40px 40px;animation:gridScroll 20s linear infinite}
    @keyframes gridScroll{0%{background-position:0 0}100%{background-position:0 40px}}

    /* Scanning line */
    .scanline{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;opacity:.04}
    .scanline::after{content:'';position:absolute;top:-100%;left:0;width:100%;height:8px;background:linear-gradient(transparent,var(--cyber-neon),transparent);animation:scan 6s linear infinite}
    @keyframes scan{0%{top:-10%}100%{top:110%}}

    /* Floating orbs */
    .orb{position:absolute;border-radius:50%;filter:blur(80px);animation:float var(--dur) ease-in-out infinite;opacity:.4;pointer-events:none}
    .orb-1{width:300px;height:300px;background:var(--cyber-purple);top:10%;left:5%;--dur:8s}
    .orb-2{width:250px;height:250px;background:var(--cyber-pink);top:60%;right:5%;--dur:10s;animation-delay:-3s}
    .orb-3{width:200px;height:200px;background:var(--cyber-neon);bottom:10%;left:30%;--dur:12s;animation-delay:-6s}
    @keyframes float{0%,100%{transform:translate(0,0) scale(1)}25%{transform:translate(35px,-25px) scale(1.06)}50%{transform:translate(-20px,18px) scale(.94)}75%{transform:translate(-30px,-12px) scale(1.04)}}

    /* Noise */
    .noise-overlay{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.015;
      background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      background-size:256px 256px}

    .login-wrapper{position:relative;z-index:1;width:100%;max-width:400px;padding:20px}
    /* Neon glass card */
    .login-card{background:rgba(255,255,255,.03);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--cyber-border);border-radius:16px;padding:36px 28px;box-shadow:0 0 30px rgba(0,243,255,.1),inset 0 1px 0 rgba(0,243,255,.05);transition:all .3s ease}
    .login-card:hover{border-color:var(--cyber-border2);box-shadow:0 0 40px rgba(0,243,255,.2)}
    .family-icon{text-align:center;font-size:3rem;margin-bottom:8px;filter:drop-shadow(0 0 10px rgba(0,243,255,.4));transition:transform .3s}
    .family-icon:hover{transform:scale(1.08)}
    .family-icon img{width:80px;height:80px;border-radius:18px;object-fit:cover;border:1px solid var(--cyber-border2)}
    .family-name{text-align:center;font-family:'Orbitron',sans-serif;font-size:1.3rem;font-weight:800;color:var(--cyber-neon);margin-bottom:4px;letter-spacing:3px;text-transform:uppercase}
    .family-sub{text-align:center;color:var(--cyber-text3, #4dd0e1);font-size:.78rem;margin-bottom:24px}

    .form-group{margin-bottom:14px}
    .form-group label{display:block;font-size:.72rem;font-weight:600;color:var(--cyber-neon);margin-bottom:5px;text-transform:uppercase;letter-spacing:1px;font-family:'Orbitron',sans-serif}
    .form-group input{width:100%;padding:12px 16px;background:rgba(255,255,255,.04);border:1px solid var(--cyber-border);border-radius:10px;color:#e0f7fa;font-size:.88rem;font-family:'Inter',sans-serif;transition:all .2s ease}
    .form-group input::placeholder{color:rgba(0,243,255,.2)}
    .form-group input:focus{outline:none;border-color:var(--cyber-neon);box-shadow:0 0 15px rgba(0,243,255,.2),0 0 30px rgba(0,243,255,.05);background:rgba(0,243,255,.05)}

    .btn{width:100%;padding:14px;background:rgba(0,243,255,.08);color:var(--cyber-neon);border:1px solid var(--cyber-border2);border-radius:10px;font-family:'Orbitron',sans-serif;font-size:.9rem;font-weight:700;cursor:pointer;transition:all .2s ease;letter-spacing:3px;text-transform:uppercase}
    .btn:hover{background:rgba(0,243,255,.15);box-shadow:0 0 25px rgba(0,243,255,.3);transform:translateY(-2px)}
    .btn:active{transform:translateY(0)}
    .error{background:rgba(255,0,128,.08);color:var(--cyber-pink);padding:10px 14px;border-radius:8px;font-size:.8rem;margin-bottom:14px;display:none;text-align:center;border:1px solid rgba(255,0,128,.2)}
    .spinner{display:none;width:22px;height:22px;border:2px solid rgba(0,243,255,.15);border-top-color:var(--cyber-neon);border-radius:50%;animation:spin .6s linear infinite;margin:12px auto 0}
    @keyframes spin{to{transform:rotate(360deg)}}

    .credits{text-align:center;margin-top:16px;color:rgba(0,243,255,.15);font-size:.68rem;font-family:'Orbitron',sans-serif;letter-spacing:1px}
  </style>
</head>
<body>
<div class="grid-overlay"></div>
<div class="scanline"></div>
<div class="noise-overlay"></div>
<div class="orb orb-1"></div><div class="orb orb-2"></div><div class="orb orb-3"></div>

<div class="login-wrapper">
  <div class="login-card">
    <div class="family-icon" id="familyIcon">👨‍👩‍👧‍👦</div>
    <div class="family-name" id="familyName">KELUARGA</div>
    <div class="family-sub">◆ SISTEM KALENDAR KELUARGA ◆</div>
    <div class="error" id="error"></div>
    <form id="loginForm" onsubmit="login(event)">
      <div class="form-group"><label>ID</label><input type="text" id="username" required placeholder="MASUKKAN USERNAME" autocomplete="username"></div>
      <div class="form-group"><label>KOD</label><input type="password" id="password" required placeholder="••••••" autocomplete="current-password"></div>
      <button type="submit" class="btn" id="loginBtn">AKSES</button>
      <div class="spinner" id="spinner"></div>
    </form>
  </div>
  <div class="credits">◆ FAMILY CALENDAR v2.0 ◆</div>
</div>

<script>
fetch('/api/settings').then(r=>r.json()).then(function(d){
  document.getElementById('familyName').textContent=(d.family_name||'KELUARGA').toUpperCase();
  document.title=(d.family_name||'Keluarga')+' — Log Masuk';
  var iconEl=document.getElementById('familyIcon');
  if(d.custom_icon)iconEl.innerHTML='<img src="/uploads/'+d.custom_icon+'" alt="icon">';
  else iconEl.textContent=d.login_icon||'👨‍👩‍👧‍👦'
}).catch(function(){});

async function login(e){
  e.preventDefault();document.getElementById('error').style.display='none';document.getElementById('loginBtn').style.display='none';document.getElementById('spinner').style.display='block';
  try{
    var r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('username').value,password:document.getElementById('password').value})});
    var d=await r.json();
    if(!r.ok){document.getElementById('error').textContent=d.error;document.getElementById('error').style.display='block';document.getElementById('loginBtn').style.display='block';document.getElementById('spinner').style.display='none';return}
    localStorage.setItem('token',d.token);localStorage.setItem('user',JSON.stringify(d.user));
    window.location.href='/';
  }catch(err){document.getElementById('error').textContent='RALAT RANGKAIAN';document.getElementById('error').style.display='block';document.getElementById('loginBtn').style.display='block';document.getElementById('spinner').style.display='none'}
}
</script>
</body>
</html>
